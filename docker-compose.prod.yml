version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cmssync-backend
    environment:
      # Required: Fernet key for encrypting Magento API tokens at rest (see docs/DEPLOYMENT.md)
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Set ENCRYPTION_KEY, see docs/DEPLOYMENT.md}
      # SQLite file inside the persisted data volume; the async driver is required.
      - DATABASE_URL=sqlite+aiosqlite:////app/data/cmssync.db
      - DATA_DIR=/app/data
      - INSTANCES_DATA_DIR=/app/data/instances
      # Browser origins allowed to call the API directly (comma-separated). The bundled
      # frontend talks to the API through nginx on the same origin, so this only matters
      # if you call the API from another origin.
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
    volumes:
      - backend-data:/app/data
    restart: always
    networks:
      - cmssync-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # The built UI calls /api on its own origin; nginx.conf proxies that to the backend.
    container_name: cmssync-frontend
    ports:
      - "${PORT:-80}:80"
    depends_on:
      - backend
    restart: always
    networks:
      - cmssync-network

networks:
  cmssync-network:
    driver: bridge

volumes:
  backend-data: