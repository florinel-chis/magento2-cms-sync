version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cmssync-backend
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/cmssync.db
      - DATA_DIR=/app/data
      - INSTANCES_DATA_DIR=/app/data/instances
      - CORS_ORIGINS=http://localhost,http://localhost:3000,http://localhost:3001
    volumes:
      - ./backend/data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cmssync-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped